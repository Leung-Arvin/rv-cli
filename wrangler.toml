name = "rv-cli"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[ai]
binding = "AI"

# The System Prompt lives here so the Agent's Personality changes without a Deploy.
[[kv_namespaces]]
binding = "PROMPTS"
id = "TODO-run-wrangler-kv-namespace-create-PROMPTS"

# Corrections from `feedback <Correction>`.
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "rv-feedback"
database_id = "TODO-run-wrangler-d1-create-rv-feedback"

# Ten Questions a Minute per IP. Counted per Location, which is fine for Abuse.
[[unsafe.bindings]]
name = "AMA_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
