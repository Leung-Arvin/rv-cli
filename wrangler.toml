name = "rv-cli"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static assets and nothing else. The content is generated into the bundle at
# build time, so there is no database, no KV, and no API to rate limit.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
